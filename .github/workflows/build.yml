name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore / build
        run: dotnet build -c Release -v q

      - name: Self test (443 assertions, no desktop input)
        shell: pwsh
        run: |
          & ".\bin\Release\net10.0-windows\MouseWheelEnhancement.App.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hot-path allocation benchmark
        shell: pwsh
        run: |
          & ".\bin\Release\net10.0-windows\MouseWheelEnhancement.App.exe" --benchhook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish framework-dependent x64
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o out/x64 -v q --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MouseWheelEnhancement-win-x64
          path: out/x64/MouseWheelEnhancement.App.exe
